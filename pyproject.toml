[build-system]
requires = ["setuptools>=64", "wheel", "torch>=2.0.0", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "metal-ssm"
version = "0.1.0"
description = "Fused Metal kernel for Mamba selective scan on Apple Silicon"
authors = [
    {name = "Çağatay Çallı", email = "cagataycalli@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ninja",
    "numpy",
]

[tool.setuptools.packages.find]
where = ["src"]
